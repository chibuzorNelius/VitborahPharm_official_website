<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#f3f6f4"/>
      </linearGradient>
      <linearGradient id="boxShade" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="85%" stop-color="#f8faf8"/>
        <stop offset="100%" stop-color="#e0e8e2"/>
      </linearGradient>
      <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0e2316" flood-opacity="0.12"/>
      </filter>
    </defs>
    <rect width="400" height="400" fill="transparent"/>
    
    <!-- Shadow Floor -->
    <ellipse cx="200" cy="350" rx="140" ry="24" fill="#0c1f13" opacity="0.1" filter="blur(8px)"/>
    
    <!-- 3D Medicine Box Body -->
    <g filter="url(#dropShadow)">
      <!-- Main Front Face -->
      <rect x="75" y="70" width="250" height="250" rx="12" fill="url(#boxShade)" stroke="#d9e2db" stroke-width="2"/>
      
      <!-- Top Brand Header Bar -->
      <path d="M 75 82 Q 75 70 87 70 L 313 70 Q 325 70 325 82 L 325 110 L 75 110 Z" fill="#0284C7"/>
      <text x="90" y="96" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">VITBORAH PHARMA</text>
      <circle cx="305" cy="90" r="8" fill="#E83D36"/>
      <circle cx="305" cy="90" r="3" fill="#ffffff"/>
      
      <!-- Accent Stripe -->
      <rect x="75" y="110" width="250" height="6" fill="#E83D36"/>
      
      <!-- Product Graphic / Badge -->
      <rect x="95" y="135" width="210" height="58" rx="8" fill="#f4f8f5" stroke="#e1ebe3" stroke-width="1.5"/>
      <text x="110" y="170" fill="#0284C7" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900">LEVOTREAT 500</text>
      
      <!-- Strength & Subtitle -->
      <text x="95" y="215" fill="#202820" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Levofloxacin Tablets 500mg</text>
      
      <!-- Dosage form pill -->
      <rect x="95" y="235" width="110" height="26" rx="13" fill="#0284C715" stroke="#0284C740" stroke-width="1"/>
      <text x="150" y="252" fill="#0284C7" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">10 Tablets</text>
      
      <!-- Quality Stamp / hologram -->
      <g transform="translate(235, 235)">
        <circle cx="20" cy="20" r="18" fill="#e8f5ec" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="2,2"/>
        <text x="20" y="18" text-anchor="middle" fill="#0284C7" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800">cGMP</text>
        <text x="20" y="27" text-anchor="middle" fill="#555" font-family="system-ui, -apple-system, sans-serif" font-size="7">PASSED</text>
      </g>
      
      <!-- Bottom Regulatory / Details Line -->
      <line x1="95" y1="285" x2="305" y2="285" stroke="#e0e8e2" stroke-width="1.5"/>
      <text x="95" y="304" fill="#6c7870" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600">Prescription Healthcare Formulation</text>
      <text x="305" y="304" text-anchor="end" fill="#0284C7" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800">WHO-STD</text>
    </g>
  </svg>